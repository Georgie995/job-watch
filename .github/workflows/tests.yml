# Runs the tests on GitHub's own Linux and Windows machines after every push, and every Monday
# even if nothing was pushed (so a change in delivery-ops-hub or a new Python is noticed).
# The jobs here are fake jobs from tests/jobs.py: this is not a real rclone or tape run.
name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # The alert tests reuse delivery-ops-hub's sender, so it's fetched next to this repo,
      # exactly as the folders sit on the author's PC.
      - uses: actions/checkout@v4
        with:
          path: job-watch
      - uses: actions/checkout@v4
        with:
          repository: Georgie995/delivery-ops-hub
          path: delivery-ops-hub
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q -rs
        working-directory: job-watch
